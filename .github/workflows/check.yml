name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with release.yml (pinned for the same reason: lockfile format).
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run compile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Test
        run: bun run test

      # The build is where WXT resolves entrypoints and the manifest; a broken one
      # passes every check above.
      - name: Build
        run: |
          bun run build
          bun run build:firefox
